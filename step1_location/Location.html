<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F!xit Location</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="Location.css" />
  </head>

  <body>
    <header>
      <h1 class="logo">Fix!t</h1>

      <!-- Primary Navigation: Desktop menu -->
      <nav>
        <ul class="main-nav">
          <li><a href="#">About</a></li>
          <li><a href="#">View Reports</a></li>
          <!-- Visual separator for navigation items -->
          <li class="nav-divider" role="presentation" aria-hidden="true">|</li>
          <li><a href="#">Login</a></li>
          <li><a href="#">Report It</a></li>
        </ul>
      </nav>

      <!-- ✅ Accessible hamburger menu button -->
      <!-- aria labelling for accessibility on hamburger menu icon -->
      <button
        class="menu-icon"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        aria-controls="main-nav"
        tabindex="0"
      >
        &#9776;
      </button>
    </header>

    <main>
      <div class="form-container">
        <h2>Where is the issue?</h2>

        <!-- button changed to on click -->
        <div class="location-container" id="location-input">
          <input
            type="text"
            id="locationInput"
            class="location-text"
            placeholder="Enter location"
          />
          <button onclick="updateMap()" class="location-btn">Enter</button>
        </div>

        <!-- Map Container/ location fix -->
        <div class="map-container">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d242952.64929211955!2d174.58954981064633!3d-36.862674207435546!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6d0d47fb5a9ce6fb%3A0x500ef6143a29917!2sAuckland!5e0!3m2!1sen!2snz!4v1753225286720!5m2!1sen!2snz"
            width="600"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            id="mapIframe"
            location="Auckland, New Zealand"
          ></iframe>
        </div>

        <p>Has your issue been reported?</p>

        <div class="form-buttons-container">
          <a href="../home/home.html">
            <button onclick="" type="button" class="btn-secondary">Back</button>
          </a>
          <a href="../step2/category.html">
            <button onclick="" type="button" class="btn-primary">Next</button>
          </a>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <div class="footer-section">
          <h4>Get Help</h4>
          <ul>
            <li><a href="#">Contact Us</a></li>
            <li><a href="#">Local Government</a></li>
          </ul>
        </div>

        <div class="footer-section">
          <h4>Get Involved</h4>
          <ul>
            <li><a href="#">Volunteer</a></li>
            <li><a href="#">Work with Us</a></li>
          </ul>
        </div>
        <div class="footer-section">
          <h4>Legal</h4>
          <ul>
            <li><a href="#">Privacy Policy</a></li>
            <li><a href="#">Terms & Conditions</a></li>
          </ul>
        </div>
      </div>

      <div class="footer-socials">
        <a href="#"><i class="fa-brands fa-square-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-square-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-square-x-twitter"></i></a>
      </div>

      <div class="footer-divider"></div>

      <div class="footer-copy">&copy; 2025 FixIt. All rights reserved.</div>
    </footer>

    <!-- JavaScript for mobile menu toggle -->
    <!-- <script>
      const menuIcon = document.querySelector(".menu-icon");
      const mainNav = document.querySelector(".main-nav");

      menuIcon.addEventListener("click", function () {
        mainNav.classList.toggle("open");
      });
    </script> -->

    <script>
      // Function to update the map based on user input / location
      // This function will be called when the user clicks the "Enter" button
      function updateMap() {
        const locationInput = document.getElementById("locationInput");
        const mapIframe = document.getElementById("mapIframe");
        const location = encodeURIComponent(locationInput.value); // Encode for URL safety

        // Update the iframe source with the new location
        const newSrc = `https://www.google.com/maps/embed/v1/place?key=AIzaSyDcnIBGzuxp44kFkxb1SWJAnhGzhynNh_4&q=${location}`;

        mapIframe.src = newSrc;
      }

      // JavaScript for mobile menu toggle
      const menuIcon = document.querySelector(".menu-icon");
      const mainNav = document.querySelector(".main-nav");

      menuIcon.addEventListener("click", () => {
        const isExpanded = menuIcon.getAttribute("aria-expanded") === "true";
        menuIcon.setAttribute("aria-expanded", String(!isExpanded));
        mainNav.classList.toggle("show");
      });
    </script>
  </body>
</html>
